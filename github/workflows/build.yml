name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q DesiDrive.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle -p DesiDrive :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Desidriver-apk
          path: DesiDrive/android/build/outputs/apk/debug/*.apk
